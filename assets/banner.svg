  <rect x="0.5" y="0.5" width="1199" height="319" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <text x="64" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#64748b">~/langkat <tspan fill="#22d3ee">$</tspan> whoami</text>
  <text x="64" y="172" font-family="Montserrat,'Helvetica Neue',Arial,sans-serif" font-size="76" font-weight="800" fill="#f8fafc" letter-spacing="-2">Muhammad Rafi</text>
